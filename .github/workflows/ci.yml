name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test and Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: telegram_trader_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Go dependencies
      run: go mod download

    - name: Install TypeScript dependencies
      run: |
        cd galachain-service
        npm ci

    - name: Run Go tests with coverage
      run: |
        go test -coverprofile=coverage.out ./...
        go tool cover -html=coverage.out -o coverage.html

    - name: Check Go coverage threshold
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Go coverage: $COVERAGE%"
        if (( $(echo "$COVERAGE < 70" | bc -l) )); then
          echo "ERROR: Go coverage $COVERAGE% is below threshold 70%"
          exit 1
        fi

    - name: Run TypeScript tests with coverage
      run: |
        cd galachain-service
        npm run test -- --coverage --coverageDirectory=../coverage/typescript

    - name: Check TypeScript coverage threshold
      run: |
        COVERAGE=$(cat coverage/typescript/coverage-summary.json | grep -o '"lines":{"total":[0-9]*,"covered":[0-9]*' | head -1 | awk -F: '{print $3","$5}' | awk -F, '{if ($1 > 0) printf "%.2f", ($2/$1)*100; else print "0"}')
        echo "TypeScript coverage: $COVERAGE%"
        if (( $(echo "$COVERAGE < 70" | bc -l) )); then
          echo "ERROR: TypeScript coverage $COVERAGE% is below threshold 70%"
          exit 1
        fi

    - name: Upload Go coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.out
        flags: go
        name: go-coverage

    - name: Upload TypeScript coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage/typescript/coverage-final.json
        flags: typescript
        name: typescript-coverage

    - name: Upload coverage reports as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: |
          coverage.html
          coverage/typescript/lcov-report/

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Run go vet
      run: go vet ./...

    - name: Run go fmt check
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "Go files are not formatted. Run 'gofmt -w .'"
          gofmt -l .
          exit 1
        fi

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build Go service
      run: go build -v ./cmd/telegram-bot

    - name: Build TypeScript service
      run: |
        cd galachain-service
        npm ci
        npm run build
