version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: telegram-trader-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-telegram_trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-telegram_trader}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telegram_trader}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telegram-trader-network

  # GalaChain Service (TypeScript gRPC service)
  galachain-service:
    build:
      context: ../galachain-service
      dockerfile: Dockerfile
    container_name: telegram-trader-galachain
    environment:
      - GRPC_PORT=50051
      - DATABASE_URL=postgresql://${POSTGRES_USER:-telegram_trader}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-telegram_trader}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - GSWAP_API_URL=${GSWAP_API_URL:-https://swap.gala.com/api}
    volumes:
      - ../logs:/app/logs
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "node dist/index.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - telegram-trader-network
    restart: unless-stopped

  # Telegram Bot Service (Go)
  bot-service:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: telegram-trader-bot
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - BOT_ADMIN_USER_IDS=${BOT_ADMIN_USER_IDS}
      - DATABASE_URL=${DATABASE_URL:-telegram-trader.db}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - GALACHAIN_SERVICE_URL=galachain-service:50051
    volumes:
      - ../logs:/root/logs
      - bot-data:/root/data
    depends_on:
      galachain-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "telegram-bot"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - telegram-trader-network
    restart: unless-stopped

networks:
  telegram-trader-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  bot-data:
    driver: local
